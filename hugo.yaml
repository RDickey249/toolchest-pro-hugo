baseURL: "https://toolchest.pro"
languageCode: "en-us"
title: "ToolChest"

# Enhanced Site Parameters
params:
  description: "Anti-overwhelm business tool curation platform to help you research and find the right tools without the research fatigue"
  tagline: "Find the Right Business Tools Without the Overwhelm"
  author: "ToolChest Editorial Team"
  keywords: ["business tools", "software directory", "tool comparison", "business software", "saas tools", "productivity tools"]
  twitter: "@toolchestpro"
  
  # SEO Enhancement
  images: ["/images/toolchest-logo.png"]

# SEO-optimized taxonomies
taxonomies:
  category: "categories"
  tag: "tags"

# SEO-friendly permalinks
permalinks:
  categories: "/categories/:slug/"
  posts: "/:year/:month/:slug/"

# Enhanced markup configuration
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
  highlight:
    style: github
    lineNos: false
    tabWidth: 2

# Sitemap Configuration
sitemap:
  changefreq: "weekly"
  priority: 0.5
  filename: "sitemap.xml"

# Minification for performance
minify:
  disableXML: false
  minifyOutput: true
  tdewolff:
    html:
      keepDefaultAttrVals: false
      keepDocumentTags: true
      keepEndTags: true
      keepQuotes: false
      keepWhitespace: false
    css:
      keepCSS2: true
      precision: 0
    js:
      keepVarNames: false
      precision: 0

# Enhanced menu
menu:
  main:
    - name: "Home"
      url: "/"
      weight: 1
    - name: "Categories"
      url: "/categories/"
      weight: 2
    - name: "About"
      url: "/about/"
      weight: 3

# Output formats for SEO
outputs:
  home: ["HTML", "RSS", "JSON"]
  page: ["HTML"]
  section: ["HTML", "RSS"]

# Related content for better internal linking
related:
  includeNewer: true
  indices:
    - name: "categories"
      weight: 100
    - name: "tags"
      weight: 80
    - name: "keywords"
      weight: 60
  threshold: 80
  toLower: false