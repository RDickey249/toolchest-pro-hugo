<!DOCTYPE html>
<html lang="en-us" data-site="toolchest-static">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    
    <!-- Premium hooks for future enhancement -->
    <meta name="toolchest-version" content="static-v1.0">
    <link rel="canonical" href="{{ .Permalink }}">
    
    <!-- Tank-simple styling -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Header - Logo Inspired Colors */
        .site-header { background: #4A5568; color: #F7FAFC; padding: 1rem 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo a { color: #F7FAFC; text-decoration: none; font-size: 1.5rem; font-weight: bold; }
        .main-nav a { color: #F7FAFC; text-decoration: none; margin-left: 2rem; transition: color 0.3s ease; }
        .main-nav a:hover { color: #FB923C; }
        
        /* Main content area with premium hooks */
        .main-content { min-height: 80vh; padding: 2rem 0; }
        .premium-overlay-zone { position: relative; }
        
        /* Grid layouts */
        .grid { display: grid; gap: 2rem; }
        .grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
        .grid-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
        
        /* Cards - Logo Inspired */
        .card { background: white; border: 1px solid #E2E8F0; border-radius: 8px; padding: 1.5rem; box-shadow: 0 2px 4px rgba(74, 85, 104, 0.1); transition: all 0.3s ease; }
        .card:hover { box-shadow: 0 6px 16px rgba(74, 85, 104, 0.15); border-color: #DC2626; }
        .card h2, .card h3 { margin-bottom: 0.5rem; }
        .card h2 a, .card h3 a { color: #4A5568; text-decoration: none; transition: color 0.3s ease; }
        .card h2 a:hover, .card h3 a:hover { color: #DC2626; }
        
        /* Breadcrumbs - Logo Inspired */
        .breadcrumb { margin-bottom: 2rem; padding: 1rem 0; border-bottom: 1px solid #E2E8F0; }
        .breadcrumb a { color: #718096; text-decoration: none; transition: color 0.3s ease; }
        .breadcrumb a:hover { color: #DC2626; }
        .breadcrumb span { color: #4A5568; }
        
        /* Tool counts and meta */
        .tool-count { color: #666; font-size: 0.9rem; margin-top: 1rem; }
        .page-description { color: #666; margin-bottom: 2rem; font-size: 1.1rem; }
        .sample-tools { margin-top: 1rem; font-size: 0.9rem; color: #666; }
        .subcategory-section { margin-top: 3rem; }
        .subcategory-card h3 { margin-bottom: 0.5rem; }
        .subcategory-card .sample-tools { font-size: 0.8rem; color: #888; }
        
        /* Home page hero - Logo Inspired */
        .home-hero { background: linear-gradient(135deg, #4A5568 0%, #2D3748 100%); color: #F7FAFC; padding: 4rem 0; text-align: center; }
        .hero-content h1 { font-size: 3rem; margin-bottom: 1rem; }
        .hero-tagline { font-size: 1.2rem; margin-bottom: 2rem; opacity: 0.9; }
        .hero-actions { margin-top: 2rem; }
        .btn { display: inline-block; padding: 1rem 2rem; border-radius: 6px; text-decoration: none; font-weight: 600; transition: all 0.3s ease; }
        .btn-primary { background: #DC2626; color: #F7FAFC; }
        .btn-primary:hover { background: #B91C1C; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3); }
        
        /* Featured tools - Logo Inspired */
        .featured-tools { background: #F7FAFC; padding: 3rem 0; }
        .featured-tools h2 { text-align: center; margin-bottom: 2rem; color: #4A5568; }
        .tool-card .tool-meta { margin-top: 1rem; }
        .category-tag, .subcategory-tag { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; margin-right: 0.5rem; font-weight: 600; }
        .category-tag { background: #DC2626; color: #F7FAFC; }
        .subcategory-tag { background: #FB923C; color: #F7FAFC; }
        
        /* Categories preview - Logo Inspired */
        .categories-preview { padding: 3rem 0; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .view-all-link { color: #DC2626; text-decoration: none; font-weight: 600; transition: color 0.3s ease; }
        .view-all-link:hover { color: #B91C1C; }
        
        /* Stats section - Logo Inspired */
        .stats-section { background: #4A5568; color: #F7FAFC; padding: 3rem 0; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2rem; text-align: center; }
        .stat-number { font-size: 2.5rem; font-weight: bold; color: #DC2626; }
        .stat-label { font-size: 1.1rem; margin-top: 0.5rem; opacity: 0.9; }
        
        /* Tool page - Logo Inspired */
        .tool-page { max-width: 800px; margin: 0 auto; }
        .tool-header { margin-bottom: 3rem; }
        .tool-header h1 { font-size: 2.5rem; margin: 1rem 0; color: #4A5568; }
        .tool-tagline { font-size: 1.2rem; color: #718096; font-style: italic; }
        .tool-content { line-height: 1.8; margin-bottom: 3rem; }
        .tool-content h2 { margin-top: 2rem; margin-bottom: 1rem; color: #4A5568; }
        .tool-content ul { margin: 1rem 0; padding-left: 2rem; }
        .tool-content li { margin-bottom: 0.5rem; }
        .related-tools { border-top: 1px solid #eee; padding-top: 2rem; }
        .related-tools h3 { margin-bottom: 1.5rem; }
        
        /* Footer - Logo Inspired */
        .site-footer { background: #4A5568; color: #F7FAFC; padding: 2rem 0; margin-top: 4rem; }
        .footer-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .footer-links a { color: #F7FAFC; text-decoration: none; margin-left: 1rem; transition: color 0.3s ease; }
        .footer-links a:hover { color: #FB923C; }
        
        /* Mobile responsive */
        @media (max-width: 768px) {
            .header-content, .footer-content { flex-direction: column; gap: 1rem; }
            .main-nav a { margin: 0 1rem; }
            .container { padding: 0 15px; }
            .grid-3 { grid-template-columns: 1fr; }
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
        }
        
        @media (max-width: 480px) {
            .grid-4 { grid-template-columns: 1fr; }
        }
    </style>
    
    <!-- Affiliate System CSS -->
    <link rel="stylesheet" href="/css/affiliate.css">
    
    <!-- Premium content hooks -->
    <div id="premium-head-inject" data-premium-zone="head" style="display: none;"></div>
</head>
<body data-page-type="{{ .Type }}" data-premium-user="false">
    <!-- Premium overlay container -->
    <div id="premium-overlay" data-premium-zone="overlay" style="display: none;"></div>
    
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="/">{{ .Site.Title }}</a>
                </div>
                <nav class="main-nav" data-premium-zone="navigation">
                    <a href="/">Home</a>
                    <a href="/categories/">Categories</a>
                    <a href="/about/">About</a>
                    <!-- Premium nav injection point -->
                    <span id="premium-nav-inject" data-premium-zone="nav-inject" style="display: none;"></span>
                </nav>
            </div>
        </div>
    </header>

    <main class="main-content premium-overlay-zone">
        <div class="container">
            {{ block "main" . }}{{ end }}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <p>&copy; {{ now.Year }} {{ .Site.Title }}. Curated by ToolChest.</p>
                    <p>{{ .Site.Params.description }}</p>
                </div>
                <div class="footer-links">
                    <a href="/about/">About</a>
                    <a href="/categories/">Browse Tools</a>
                    <!-- Premium footer injection -->
                    <span id="premium-footer-inject" data-premium-zone="footer-inject" style="display: none;"></span>
                </div>
            </div>
        </div>
    </footer>
    
    <!-- Affiliate & Conversion Tracking JavaScript -->
    <script src="/js/affiliate-tracking.js"></script>
    <script src="/js/conversion-optimizer.js"></script>
    
    <!-- Premium content hooks -->
    <div id="premium-body-inject" data-premium-zone="body" style="display: none;"></div>
</body>
</html>
